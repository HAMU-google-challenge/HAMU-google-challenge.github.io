venues:
  - region: Abruzzo
    location: Università degli Studi “Gabriele d’Annunzio” Chieti-Pescara
    status: confirmed
    note:
      it: Ateneo ospitante confermato. Aula e indirizzo saranno comunicati.
      en: Host university confirmed. The room and address will be announced.
    # Disponibilità degli spazi: non equivalgono ad aule prenotate.
    candidates:
      - university: Università degli Studi “Gabriele d’Annunzio” Chieti-Pescara
        training: Un'aula da 340 posti, eventualmente due aule vicine da 340 posti ciascuna.
        challenge: "Aule da 340, 160, 140 e 45 postazioni, con prese elettriche e Wi-Fi (Eduroam); arredi con banchi, non tavoli. Ateneo confermato il 24 settembre; assegnazione delle aule da comunicare."
  - region: Marche
    location: Università Politecnica delle Marche
    status: preferred
    note:
      it: Sede preferita, da confermare in base alle iscrizioni.
      en: Preferred venue, to be confirmed based on registrations.
    candidates:
      - university: Università Politecnica delle Marche
        training: Aula Magna da 700 posti oppure Aula Magna di Facoltà da 350 posti.
        challenge: Aule polifunzionali con prese elettriche; capienza numerica da confermare.
      - university: Università di Camerino
        training: Auditorium da 600 posti, non attrezzato.
        challenge: "900 posti complessivi: Informatica A 200+70; Informatica B 150; Sant'Agostino 120; CHIP 60+60+60; Giurisprudenza 90+90."
  - region: Umbria
    location: ""
    status: pending
    note:
      it: La sede sarà comunicata dal Comitato Organizzatore.
      en: The venue will be announced by the Organising Committee.
    candidates:
      - university: Università degli Studi di Perugia
        training: Polo di Ingegneria, massimo 300 persone, streaming possibile, fermata ferroviaria dedicata.
        challenge: Da 300 a 400 posti; ulteriore parcheggio nelle vicinanze segnalato nell’Agenda.
