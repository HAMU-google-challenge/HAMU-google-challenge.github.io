  challenge:
    eyebrow: LA CHALLENGE
    title: Competenze diverse.
    title_accent: Un progetto comune.
    text: Un’esperienza formativa e progettuale per usare l’intelligenza artificiale generativa in modo consapevole, responsabile e creativo. Il punto di partenza è un tema; il risultato, una proposta capace di produrre benefici per il territorio o la comunità.
    steps:
      - title: Impara e sperimenta
        text: La formazione introduce un uso critico dell’IA generativa e strumenti come Gemini e NotebookLM. Le istruzioni operative indicheranno gli strumenti consentiti per la prova.
      - title: Lavora con il tuo team
        text: Il Comitato Organizzatore forma i gruppi valorizzando, ove possibile, la varietà delle competenze e della provenienza accademica. Ogni team sceglie uno dei temi proposti.
      - title: Presenta la vostra idea
        text: Elaborate una proposta originale, spiegate l’uso dell’IA e presentate il progetto alla Commissione. I team selezionati accedono alla finale dell’Aquila.
  training:
    eyebrow: LA MATTINA · FORMAZIONE
    title: Prima comprendi. Poi progetta.
    name: Gemini Academy for Student
    intro: Una masterclass di Google for Education per orientarti nell’IA generativa e usarla con consapevolezza nello studio, nella ricerca e nella Challenge.
    duration: Circa 2,5–3 ore
    schedule: "Orario indicativo: 09:30–12:30"
    format: In presenza nelle sedi regionali
    method: La sessione include momenti interattivi, come la costruzione di un prompt insieme al docente. È una masterclass dimostrativa; il lavoro pratico in team si svolge durante la Challenge del pomeriggio.
    topics:
      - title: Usare l’IA responsabilmente
        text: Integrità accademica, trasparenza e uso etico dell’IA, con una riflessione sul quadro europeo e sull’AI Act.
      - title: Fare le domande giuste
        text: Tecniche di prompting, valutazione critica delle risposte e integrazione dell’IA nei processi di studio e ricerca.
      - title: Lavorare con le fonti
        text: Gemini e NotebookLM per analizzare le fonti, sintetizzare i concetti e strutturare le idee da sviluppare nella sfida.
    certificate_label: IL TUO PERCORSO
    certificate_title: Un attestato di partecipazione.
    certificate_text: È previsto un Certificate of Attendance Google for Education per tutte le studentesse e tutti gli studenti partecipanti, da inserire nel curriculum.
    credits_note: L’eventuale riconoscimento di CFU dipende dal tuo corso di studio e non è automatico.
    schedule_note: La mattina è dedicata alla formazione; dopo la pausa pranzo si passa alla Challenge. Gli orari definitivi saranno comunicati dall’organizzazione.
