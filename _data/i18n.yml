  challenge:
    eyebrow: THE CHALLENGE
    title: Different skills.
    title_accent: One shared project.
    text: An educational, project-based experience in the informed, responsible and creative use of generative AI. Start with a theme and develop a proposal that could deliver tangible benefits for the local area or community.
    steps:
      - title: Learn and experiment
        text: Training introduces a critical approach to generative AI and tools such as Gemini and NotebookLM. The operational instructions will specify which tools may be used during the challenge.
      - title: Work with your team
        text: The Organising Committee forms groups, taking account where possible of diversity in skills and academic backgrounds. Each team chooses one of the proposed themes.
      - title: Present your idea
        text: Develop an original proposal, explain how you used AI and present your project to the judging panel. Selected teams progress to the final in L’Aquila.
  training:
    eyebrow: MORNING · TRAINING
    title: Understand first. Then create.
    name: Gemini Academy for Student
    intro: A Google for Education masterclass to help you navigate generative AI and use it thoughtfully in your studies, research and the Challenge.
    duration: Around 2.5–3 hours
    schedule: "Indicative time: 09:30–12:30"
    format: In person at the regional venues
    method: The session includes interactive moments, such as developing a prompt together with the instructor. It is a demonstration-based masterclass; hands-on teamwork takes place during the afternoon Challenge.
    topics:
      - title: Use AI responsibly
        text: Academic integrity, transparency and ethical AI use, with a discussion of the European framework and the AI Act.
      - title: Ask better questions
        text: Prompting techniques, critical evaluation of responses and integrating AI into study and research processes.
      - title: Work with sources
        text: Gemini and NotebookLM for analysing sources, synthesising concepts and structuring the ideas you will develop in the challenge.
    certificate_label: YOUR LEARNING JOURNEY
    certificate_title: A certificate of attendance.
    certificate_text: A Google for Education Certificate of Attendance is planned for all participating students, to include in their CV.
    credits_note: Any recognition of academic credits (CFU) is subject to your degree programme’s decision and is not automatic.
    schedule_note: Training takes place in the morning, followed by a lunch break and the Challenge. The organisers will announce the final timetable.
  programme:
    eyebrow: THE JOURNEY
    title: Save the dates.
    intro: From your application to the final, here are the stages of the Challenge.
    deadline: Application deadline
    deadline_note: Closing time to be announced.
    teams: Teams, themes and venues
    teams_note: By this date, you will receive your team composition, the themes and your assigned venue.
    challenge: Training and Challenge
    challenge_note: Gemini Academy masterclass in the morning and preliminary stage in the afternoon, at three regional venues. The final timetable will be announced.
    final: Final in L’Aquila
    final_date: Week of 23 November
    final_note: Planned window for the final at the University of L’Aquila. The organisers will confirm the day, exact location and timetable.
    hours: hours maximum to develop your proposal
    minutes: minutes maximum to present
    questions: The judging panel may ask questions after the presentation.
  participation:
    eyebrow: HOW TO TAKE PART
    title: Bring your skills.
    accent: We’ll put the team together.
    text: Apply individually. The Challenge is open to students duly enrolled in a bachelor’s, master’s or single-cycle master’s degree at a participating university, with tuition fees up to date at the application deadline.
    gssi: The Gran Sasso Science Institute may also admit first- and second-year PhD students. You must remain enrolled until the end of the final stage.
    full_rules: Read the full eligibility requirements
    deadline: Apply by
    planned: Applications opening soon
    planned_note: The application form and privacy notice will be available here. In the meantime, you can read the Challenge documents.
    open: Apply to the Challenge
    open_note: Before submitting your application, read the Regulations and the personal data processing notice.
    closed: Applications closed
    closed_note: Follow programme updates and communications from the Organising Committee.
    privacy: Personal data processing notice
    documents: View the documents
  evaluation:
    eyebrow: ASSESSMENT
    title: From ideas to impact.
    intro: A shared assessment grid across all venues, with a maximum of 100 points. Final-stage assessment is independent of the preliminary stage.
    points: points
    final_teams: teams at most in the final
    detail: Up to three teams per theme at each venue, with place reallocation as set out in the Regulations. One winning team for each theme.
  universities:
    eyebrow: HAMU UNIVERSITIES
    title: Three regions, ten universities.
    intro: A university network across Abruzzo, Marche and Umbria. The preliminary stage takes place at three regional venues assigned by the Organising Committee.
    venue: Preliminary-stage venue
    venue_tbc: Venue to be confirmed
    venue_note: Your assigned venue may differ from your home university and will be announced within the stated timeframe.
    website: University website
  documents:
    eyebrow: BEFORE YOU APPLY
    title: Challenge documents.
    intro: Eligibility, rules and information to help you prepare your application.
    draft_note: Editable copies, the English translation, the call for applications and the poster are available as drafts. Final versions will be published after validation.
    review_note: The Italian regulations PDF is awaiting approval by the universities. Personal data and recording provisions are being reviewed by the Data Protection Officer.
    review: Awaiting approval
    draft: Draft
    approved: Final
    download: Download
    privacy_pending: The privacy notice is being prepared and will be available before applications open.
  faq:
    eyebrow: NEED TO KNOW
    title: Frequently asked questions.
    items:
      - q: What language will the training be delivered in?
        a: Official Gemini Academy slides and materials are in English. The masterclass may be delivered in Italian or English, depending on the participants; the language will be announced with the final programme. Using English for projects and pitches is encouraged.
      - q: How should I prepare to access the tools?
        a: Check with your university that your institutional account is available and that the relevant services are enabled. The operational instructions will explain platform access and which tools may be used during the challenge. Arrangements for students who have not yet received institutional credentials are still being defined.
      - q: Do I need to have a team already?
        a: No. Applications are individual. The Organising Committee forms teams and announces their composition at least one week before the preliminary stage.
      - q: Will I take part at my own university?
        a: Not necessarily. The Committee assigns your venue, which may differ from your home university. The three regional venues will be announced at least seven days before the challenge.
      - q: Which artificial intelligence tools can I use?
        a: Only those specified by the organisers. Additional applications, sources or tools are permitted only if expressly allowed by the operational instructions. You must declare your use of AI, verify generated content and respect third-party rights and personal data instructions.
      - q: Are expenses reimbursed or cash prizes offered?
        a: The Regulations do not provide for reimbursement of expenses or financial support from HAMU universities, cash prizes or other financial benefits. Winning teams may receive certificates, mentions or other recognition with no monetary value.
      - q: Can I take part as a PhD student?
        a: The Regulations allow for the possible admission of first- and second-year PhD students at the Gran Sasso Science Institute. At other universities, eligibility covers bachelor’s, master’s and single-cycle master’s degree programmes.
      - q: Where will the results be published?
        a: Results will be published on the institutional websites of the universities concerned, constituting official notification. Comments must be submitted within 24 hours and may concern only manifest clerical errors, arithmetic inconsistencies or evident breaches of the criteria. Article 12 excludes challenges to the merits of the assessment or comparison; Article 18 preserves the administrative and judicial remedies provided by law.
      - q: Who owns the projects?
        a: Participation does not transfer project rights to the universities or Google. The Regulations grant the universities a free, non-exclusive and non-transferable licence for five years, for the institutional and communication purposes specified in Article 13, with attribution to the authors. Commercial exploitation, sublicensing and transfer of rights to Google or others are excluded. Presentations may be public, and disclosure may affect the ability to obtain patents or other industrial property protection.
      - q: Must I consent to recordings in order to take part?
        a: The Regulations provide for a specific notice covering photographs and audio and video recordings. Where consent is required for use of a person’s image, it is obtained through a separate, specific and revocable declaration. Refusal does not affect participation or assessment of the project. The notice will be made available following the privacy review.
