  challenge:
    eyebrow: LA CHALLENGE
    title: Competenze diverse.
    title_accent: Un progetto comune.
    text: Un’esperienza formativa e progettuale per usare l’intelligenza artificiale generativa in modo consapevole, responsabile e creativo. Il punto di partenza è un tema; il risultato, una proposta capace di produrre benefici per il territorio o la comunità.
    steps:
      - title: Impara e sperimenta
        text: La formazione introduce un uso critico dell’IA generativa e strumenti come Gemini e NotebookLM. Le istruzioni operative indicheranno gli strumenti consentiti per la prova.
      - title: Lavora con il tuo team
        text: Il Comitato Organizzatore forma i gruppi valorizzando, ove possibile, la varietà delle competenze e della provenienza accademica. Ogni team sceglie uno dei temi proposti.
      - title: Presenta la vostra idea
        text: Elaborate una proposta originale, spiegate l’uso dell’IA e presentate il progetto alla Commissione. I team selezionati accedono alla finale dell’Aquila.
