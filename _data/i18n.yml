  faq:
    eyebrow: HAI UN DUBBIO
    title: Domande frequenti.
    items:
      - q: In quale lingua si svolge la formazione?
        a: Le slide e i materiali ufficiali della Gemini Academy sono in inglese. La masterclass può svolgersi in italiano o in inglese, in base alla composizione dei partecipanti; la lingua sarà comunicata con il programma definitivo. L’uso dell’inglese per progetti e pitch è incoraggiato.
      - q: Come mi preparo all’accesso agli strumenti?
        a: Verifica con il tuo Ateneo la disponibilità dell’account istituzionale e l’abilitazione dei servizi previsti. Le istruzioni operative chiariranno l’accesso alle piattaforme e gli strumenti ammessi durante la prova. Per chi non ha ancora ricevuto le credenziali istituzionali, le modalità sono in corso di definizione.
      - q: Devo avere già un team?
        a: No. La candidatura è individuale. Il Comitato Organizzatore forma i team e ne comunica la composizione almeno una settimana prima della fase preliminare.
      - q: La Challenge si svolge nella mia università?
        a: Non necessariamente. La sede è assegnata dal Comitato e può essere diversa dal tuo Ateneo. Le tre sedi regionali saranno comunicate almeno sette giorni prima della prova.
      - q: Quali strumenti di intelligenza artificiale posso usare?
        a: Solo quelli indicati dall’organizzazione. Altre applicazioni, fonti o strumenti sono consentiti esclusivamente se previsti nelle istruzioni operative. Devi dichiarare come usi l’IA, verificare i contenuti generati e rispettare i diritti di terzi e le indicazioni sui dati personali.
      - q: Sono previsti rimborsi o premi in denaro?
        a: Il regolamento non prevede rimborsi spese o supporto economico da parte degli Atenei HAMU, né premi o altri benefici economici. Ai team vincitori possono essere assegnati attestati, menzioni o riconoscimenti privi di valore economico.
      - q: Posso partecipare se sono un dottorando?
        a: Il regolamento prevede la possibile ammissione dei dottorandi del primo e secondo anno del Gran Sasso Science Institute. Per gli altri Atenei sono previsti i corsi di laurea, laurea magistrale e laurea magistrale a ciclo unico.
      - q: Dove saranno pubblicati i risultati?
        a: Gli esiti saranno pubblicati sui siti istituzionali degli Atenei interessati, con valore di comunicazione ufficiale. Le osservazioni devono essere presentate entro 24 ore e possono riguardare solo errori materiali manifesti, incongruenze aritmetiche o violazioni evidenti dei criteri. L’articolo 12 non ammette contestazioni sul merito valutativo o comparativo; l’articolo 18 mantiene ferme le tutele amministrative e giurisdizionali previste dall’ordinamento.
      - q: A chi appartengono i progetti?
        a: La partecipazione non trasferisce i diritti sui progetti agli Atenei o a Google. Il regolamento prevede una licenza gratuita, non esclusiva e non cedibile agli Atenei per cinque anni, per gli usi istituzionali e di comunicazione indicati nell’articolo 13, con attribuzione agli autori. Sono esclusi sfruttamento commerciale, sublicenze e trasferimento dei diritti a Google o ad altri soggetti. Le presentazioni possono essere pubbliche e la divulgazione può incidere sulla possibilità di ottenere brevetti o altri titoli di proprietà industriale.
      - q: Il consenso alle riprese è obbligatorio per partecipare?
        a: Il regolamento prevede una specifica informativa per fotografie e riprese audio e video. Quando l’uso dell’immagine richiede il consenso, questo è acquisito con una dichiarazione separata, specifica e revocabile. Il mancato consenso non pregiudica la partecipazione né la valutazione del progetto. L’informativa sarà resa disponibile dopo la verifica degli aspetti privacy.
