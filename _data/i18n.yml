  faq:
    eyebrow: HAI UN DUBBIO
    title: Domande frequenti.
    items:
      - q: Devo avere già un team?
        a: No. La candidatura è individuale. Il Comitato Organizzatore forma i team e ne comunica la composizione almeno una settimana prima della fase preliminare.
      - q: La Challenge si svolge nella mia università?
        a: Non necessariamente. La sede è assegnata dal Comitato e può essere diversa dal tuo Ateneo. Le tre sedi regionali saranno comunicate almeno sette giorni prima della prova.
      - q: Quali strumenti di intelligenza artificiale posso usare?
        a: Solo quelli indicati dall’organizzazione. Altre applicazioni, fonti o strumenti sono consentiti esclusivamente se previsti nelle istruzioni operative. Devi dichiarare come usi l’IA, verificare i contenuti generati e rispettare i diritti di terzi e le indicazioni sui dati personali.
      - q: Sono previsti rimborsi o premi in denaro?
        a: Il regolamento non prevede rimborsi spese o supporto economico da parte degli Atenei HAMU, né premi o altri benefici economici. Ai team vincitori possono essere assegnati attestati, menzioni o riconoscimenti privi di valore economico.
      - q: Posso partecipare se sono un dottorando?
        a: Il regolamento prevede la possibile ammissione dei dottorandi del primo e secondo anno del Gran Sasso Science Institute. Per gli altri Atenei sono previsti i corsi di laurea, laurea magistrale e laurea magistrale a ciclo unico.
      - q: Dove saranno pubblicati i risultati?
        a: Gli esiti saranno pubblicati sui siti istituzionali degli Atenei interessati; la pubblicazione avrà valore di comunicazione ufficiale. Il regolamento disciplina anche i termini e le modalità delle osservazioni e del riesame.
